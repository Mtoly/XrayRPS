services:
  xrayr:
    # Follow the latest published XrayRP release by default.
    # Pin a specific release instead with XRAYRP_TAG=<tag> (environment variable or .env).
    image: ghcr.io/mtoly/xrayrp:${XRAYRP_TAG:-latest}
    # Always check the registry so `docker compose up -d` does not silently reuse a stale local `latest`.
    pull_policy: always
    volumes:
      - ./config:/etc/XrayR:ro
    restart: unless-stopped
    # XrayR receives panel-assigned listener ports, so host networking is retained.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:10085/livez >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
