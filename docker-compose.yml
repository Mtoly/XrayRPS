services:
  xrayr:
    # Keep the image on a reviewed release; update this tag deliberately with a release review.
    image: ghcr.io/mtoly/xrayr:0.9.1-alpha-6
    volumes:
      - ./config:/etc/XrayR:ro
    restart: unless-stopped
    # XrayR receives panel-assigned listener ports, so host networking is retained.
    network_mode: host
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
      - /run:rw,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:10085/livez >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
